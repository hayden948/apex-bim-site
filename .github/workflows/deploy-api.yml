# Deploys the Supabase side (edge function + migrations) on merge to main, so
# the API ships without anyone running a manual deploy. Requires two repository
# secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  — the project's database password (for db push)
# Until they are set, the workflow skips gracefully instead of failing.
name: Deploy API (Supabase)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

env:
  PROJECT_REF: kdqisuzydkgzkzxlctpv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Schema-drift gate: the API's EXTRACTION_SCHEMA literal must match the
      # FamilySpec schema of record before anything deploys.
      - name: FamilySpec parity check
        run: python3 schemas/familyspec/tools/check_extraction_schema.py

      - name: Check for deploy credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set — skipping deploy. Add it in repo Settings → Secrets to enable auto-deploys."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.creds.outputs.have == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        if: steps.creds.outputs.have == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --include-all

      - name: Deploy edge functions
        if: steps.creds.outputs.have == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Both functions do their own auth (apx_ tokens / user JWTs / Telegram's
        # secret header), so the platform JWT gate must stay off — a deploy
        # without --no-verify-jwt would silently break the Telegram webhook.
        run: |
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy telegram-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
